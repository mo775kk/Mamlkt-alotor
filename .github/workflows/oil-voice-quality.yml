name: Mamlakat Al-Otor storefront quality
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate clean storefront structure and product data
        run: node scripts/smoke-check.mjs
      - name: Check AI Worker request handling
        run: node scripts/ai-worker-test.mjs
